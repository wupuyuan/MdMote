name: Build Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage deb
          - os: windows-latest
            args: --win nsis portable zip
          - os: macos-latest
            args: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + main
        run: npm run build

      - name: Package installers
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          cd release
          RELEASE_TAG="${{ github.ref_name }}"
          gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "MdMote $RELEASE_TAG" --generate-notes
          shopt -s nullglob
          FILES=(*.AppImage *.deb *.exe *.zip *.dmg)
          if [ ${#FILES[@]} -gt 0 ]; then
            EXISTING=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            for f in "${FILES[@]}"; do
              lc="$(printf '%s' "$f" | tr '[:upper:]' '[:lower:]')"
              while IFS= read -r old; do
                [ -z "$old" ] && continue
                if [ "$(printf '%s' "$old" | tr '[:upper:]' '[:lower:]')" = "$lc" ]; then
                  gh release delete-asset "$RELEASE_TAG" "$old" --yes || true
                fi
              done <<< "$EXISTING"
            done
            gh release upload "$RELEASE_TAG" --clobber "${FILES[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}